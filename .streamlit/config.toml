# Blue & White base theme (light). The Dark theme is applied by the in-app toggle (see ui.py).
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F3F7FF"
secondaryBackgroundColor = "#E6EFFE"
textColor = "#0E2748"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
